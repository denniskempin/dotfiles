[package]
name = "keyagent"
version = "0.1.0"
edition = "2021"
description = "Layer keybindings for AeroSpace and the front app"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSTimer",
  "NSDate",
  "NSRunLoop",
  "NSGeometry",
  "NSArray",
  "NSDictionary",
  "NSObject",
  "NSThread",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSPanel",
  "NSWindow",
  "NSView",
  "NSColor",
  "NSFont",
  "NSScreen",
  "NSRunningApplication",
  "NSWorkspace",
  "NSBezierPath",
  "NSGraphics",
  "NSText",
  "NSParagraphStyle",
  "NSAttributedString",
  "NSStringDrawing",
  "libc",
  "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3", features = [
  "CFRunLoop",
  "CFMachPort",
  "CFDictionary",
  "CFString",
  "CFArray",
  "CFNumber",
  "CFDate",
] }
objc2-core-graphics = { version = "0.3", features = [
  "CGEvent",
  "CGEventTypes",
  "CGGeometry",
  "CGWindowLevel",
  "CGRemoteOperation",
] }
objc2-application-services = { version = "0.3", features = [
  "AXUIElement",
  "AXError",
  "HIServices",
  "libc",
] }
